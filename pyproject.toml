[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bondmaxsim"
version = "0.1.0.dev0"
description = "BOND-style dimension pruning for ColBERT MaxSim on a PDX-compatible layout"
requires-python = ">=3.10"
# Core runtime deps.  The mechanism testbed (Stages 0-2: NumPy oracle + ctypes
# kernels) needs only NumPy.  The heavy retrieval stack (torch/pylate/ranx) is
# an optional extra used by the integration stages (3-5) — see [retrieval].
dependencies = [
    "numpy>=1.24",
    "threadpoolctl>=3.6.0",
]

[project.optional-dependencies]
# Real ColBERT / BEIR integration (Stages 3-5).  Not needed for the mechanism
# testbed or the exact-agreement gate.
retrieval = [
    "torch>=2.0",
    "pylate==1.6.0",
    "ranx>=0.3",
    # CoRECT standard-metric cross-check (evaluate_results is pytrec_eval-based).
    "pytrec-eval-terrier>=0.5",
    # Stage 5 lexical reference baseline (e03).
    "bm25s>=0.2",
    "PyStemmer>=2.2",
]
faiss = [
    "faiss-cpu>=1.7",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put src/ on sys.path so `pytest` works without an editable install or a
# PYTHONPATH=src prefix (requires pytest>=7).
pythonpath = ["src"]
addopts = ["--strict-markers"]
markers = [
    "unit: fast tests with no native binary, external service, or generated artifact dependency",
    "native: tests that exercise or enforce a compiled native-kernel contract",
    "native_gate: native tests that must execute (not skip) in the native-required tier",
    "integration: fixture-scale tests spanning experiment or renderer components",
    "artifact: result-schema, catalog, evidence, or publication-output validation",
    "reproduction: clean-clone fixture and deterministic reproduction checks",
    "sanitizer: sanitizer build/harness contract checks",
    "research_audit: tests required by the full pre-publication research audit",
]
