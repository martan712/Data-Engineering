[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bondmaxsim"
version = "0.1.0.dev0"
description = "BOND-style dimension pruning for ColBERT MaxSim on a PDX-compatible layout"
requires-python = ">=3.10"
# Core runtime deps.  The mechanism testbed (Stages 0-2: NumPy oracle + ctypes
# kernels) needs only NumPy.  The heavy retrieval stack (torch/pylate/ranx) is
# an optional extra used by the integration stages (3-5) — see [retrieval].
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Real ColBERT / BEIR integration (Stages 3-5).  Not needed for the mechanism
# testbed or the exact-agreement gate.
retrieval = [
    "torch>=2.0",
    "pylate>=0.1",
    "ranx>=0.3",
]
faiss = [
    "faiss-cpu>=1.7",
]
dev = [
    "pytest>=7",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put src/ on sys.path so `pytest` works without an editable install or a
# PYTHONPATH=src prefix (requires pytest>=7).
pythonpath = ["src"]
