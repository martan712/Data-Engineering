name: research-audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tiers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tier: [unit, integration, artifact, reproduction]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - if: matrix.tier == 'integration'
        run: sudo apt-get update && sudo apt-get install -y libomp-dev
      - if: matrix.tier == 'integration'
        run: make native-portable
      - run: make test-${{ matrix.tier }}

  native-required:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: sudo apt-get update && sudo apt-get install -y libomp-dev
      - run: make native-portable
      - run: make test-native

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libomp-dev
      - run: make test-sanitize

  clean-clone-fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: sudo apt-get update && sudo apt-get install -y libomp-dev
      - run: make native-portable
      - run: make clean-clone-smoke

  full-research-audit:
    runs-on: ubuntu-24.04
    needs: [python-tiers, native-required, sanitizer, clean-clone-fixture]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: sudo apt-get update && sudo apt-get install -y libomp-dev
      - run: make native-portable
      - run: make research-audit
